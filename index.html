<!DOCTYPE html>
<html>
<head>
<title>Arsam Gaming</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(-45deg,#ff0000,#00ff00,#00ffff,#ff00ff);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    color:white;
    text-align:center;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1{
    font-size:70px;
    margin-top:50px;
    text-shadow:0 0 20px white;
}

.card{
    width:80%;
    max-width:700px;
    margin:auto;
    background:rgba(0,0,0,0.5);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(8px);
}

button{
    font-size:24px;
    padding:15px 30px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:cyan;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    background:magenta;
}

a{
    color:cyan;
    text-decoration:none;
    font-size:22px;
}
</style>
</head>

<body>

<h1>ARSAM GAMING</h1>

<div class="card">

<h2>Welcome To My Website</h2>

<p>🎮 Roblox Game Developer</p>

<p>💻 Future Web Developer</p>

<p>🚀 Learning HTML, CSS & JavaScript</p>

<p>😎 15 Years Old</p>

<a href="https://github.com/arsam109">
Visit My github
</a>

<br><br>

<button onclick="hello()">
Start Journey
</button>

</div>

<script>
function hello(){
    let name = prompt("What is your name?");

    if(name){
        alert("Welcome to Arsam Gaming, " + name + "!");
    }
}
</script>

</body>
</html>
