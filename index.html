<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ARSAM STEAM</title>

<style>
body{
margin:0;
font-family:sans-serif;
color:white;
overflow:hidden;

/* Dark Steam Style */
background: radial-gradient(circle at top,#1b2838,#0b0f14);
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 20px;
background:#171a21;
}

button{
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
background:#66c0f4;
color:black;
font-weight:bold;
}

/* LAYOUT */
.container{
display:flex;
gap:20px;
flex-wrap:wrap;
padding:20px;
}

/* CARD */
.card{
width:200px;
background:#2a475e;
border-radius:10px;
overflow:hidden;
text-align:center;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

/* PANEL */
#panel{
display:none;
position:fixed;
right:10px;
top:60px;
background:#171a21;
padding:15px;
border-radius:10px;
}

input{
display:block;
margin:5px 0;
padding:8px;
border:none;
border-radius:5px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div>🎮 ARSAM STEAM</div>
<button onclick="togglePanel()">⚙ Add Game</button>
</div>

<!-- PANEL -->
<div id="panel">
<h3>Add Game</h3>
<input id="name" placeholder="Game Name">
<input id="link" placeholder="Game Link">
<input id="img" placeholder="Image URL">
<button onclick="addGame()">Add</button>
</div>

<!-- GAMES -->
<div id="games" class="container"></div>

<script>

// Load saved games
let games = JSON.parse(localStorage.getItem("games")) || [];

function render(){
let container=document.getElementById("games");
container.innerHTML="";

games.forEach(g=>{
let card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${g.img}">
<h3>${g.name}</h3>
<button onclick="window.open('${g.link}')">Play</button>
`;
container.appendChild(card);
});
}

render();

// Toggle panel
function togglePanel(){
let p=document.getElementById("panel");
p.style.display = p.style.display==="block" ? "none":"block";
}

// Add game
function addGame(){
let name=document.getElementById("name").value;
let link=document.getElementById("link").value;
let img=document.getElementById("img").value;

if(name && link && img){
games.push({name,link,img});
localStorage.setItem("games",JSON.stringify(games));
render();
}
}

</script>

</body>
</html>
