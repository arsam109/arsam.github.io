<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ARSAM LOGIN</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
background:black;
color:white;
}

.box{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:20px;
text-align:center;
backdrop-filter:blur(10px);
}

input{
display:block;
margin:10px auto;
padding:10px;
border-radius:10px;
border:none;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffff;
}

#main{
display:none;
}

.container{
display:flex;
gap:40px;
margin-top:30px;
}
</style>

</head>

<body>

<div id="login" class="box">
<h2>Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="check()">Enter</button>
<p id="msg"></p>
</div>

<div id="main">
<h1>🎮 ARSAM SITE</h1>

<div class="container">

<div>
<h2>Games</h2>
<p>Game 1</p>
<p>Game 2</p>
</div>

<div>
<h2>Music</h2>
<p>Song 1</p>
<p>Song 2</p>
</div>

</div>

</div>

<script>
function check(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="arsam" && p=="1234"){
document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";
}else{
document.getElementById("msg").innerText="Wrong password!";
}
}
</script>

</body>
</html>
