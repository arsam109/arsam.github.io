<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ARSAM LAUNCHER</title>

<style>
body{
margin:0;
height:100vh;
font-family:sans-serif;
color:white;
overflow:hidden;

/* RGB Background */
background: linear-gradient(-45deg,#ff0000,#ff00ff,#00ffff,#0000ff);
background-size:400% 400%;
animation:bg 10s ease infinite;

display:flex;
justify-content:center;
align-items:center;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* LOGIN BOX */
.box{
background:rgba(0,0,0,0.4);
padding:30px;
border-radius:15px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(0,255,255,0.3);
}

input{
display:block;
margin:10px auto;
padding:10px;
border:none;
border-radius:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(90deg,#ff00ff,#00ffff);
}

/* MAIN */
#main{
display:none;
text-align:center;
}

.container{
display:flex;
gap:20px;
justify-content:center;
margin-top:20px;
flex-wrap:wrap;
}

.card{
width:200px;
background:rgba(0,0,0,0.4);
border-radius:15px;
padding:10px;
}

.card img{
width:100%;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="box">
<h2>🔐 ARSAM LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="check()">Enter</button>
<p id="msg"></p>
</div>

<!-- MAIN -->
<div id="main">

<h1>🎮 ARSAM LAUNCHER</h1>

<div class="container">

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg">
<p>Roblox</p>
<button onclick="window.open('https://www.roblox.com')">Play</button>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/79/Fortnite_logo.png">
<p>Fortnite</p>
<button onclick="window.open('https://www.fortnite.com')">Play</button>
</div>

</div>

</div>

<script>
function check(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="arsam" && p=="1234"){
document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";
}else{
document.getElementById("msg").innerText="❌ Wrong password!";
}
}
</script>

</body>
</html>
